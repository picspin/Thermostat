name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name MR_Thermometry --add-data "icon.png;." run.py

      - name: Package as zip
        run: |
          Compress-Archive -Path dist/MR_Thermometry.exe -DestinationPath MR_Thermometry-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR_Thermometry-windows
          path: MR_Thermometry-windows.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MR_Thermometry-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MR_Thermometry-windows.zip
          body: |
            # MR 热测量系统 v1.0.0

            这是 main 分支的第一次 Windows 打包，包含以下已合并的功能：

            - **腹部运动校正预设**：支持粗肝脏 ROI 的运动校正
            - **Cinema CEM43 热剂量**：序列完成后按 Sapareto & Dewey (1984) 计算体素级累积热剂量

            ## 重要说明

            - ⚠️ **本版本没有监管认证，不能当成治疗终点。**
            - 这是开发过程中的首次打包；体部/头部/关节预设及 UI 改进将在后续版本中发布。

            ## 安装与使用

            1. 下载 `MR_Thermometry-windows.zip`
            2. 解压后运行 `MR_Thermometry.exe`
            3. 使用 "Batch Load DICOM Files" 加载 DICOM 数据开始分析

            ## 构建信息

            - 使用 PyInstaller 在 GitHub Actions `windows-latest` 上构建
            - Python 3.11，包含 PyQt5、SimpleITK、scikit-image 等依赖
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}