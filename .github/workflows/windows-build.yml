name: windows-build

on:
  push:
    branches: [main]
    # Tag filters are globs, not regular expressions. "+" is a literal
    # character here, so v[0-9]+.[0-9]+.[0-9]+ would not match v1.2.3.
    # This glob requires a v<digits>.<digits>.<digits> shape. The release
    # job then refuses anything that is not exactly vMAJOR.MINOR.PATCH.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name MR_Thermometry --add-data "icon.png;." run.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist/MR_Thermometry.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          # The onefile bundle is about 170 MB, so extraction can take a
          # while. Fail only if the process dies before 90 seconds.
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 3
            $alive = @(Get-Process -Name MR_Thermometry -ErrorAction SilentlyContinue)
            if ($alive.Count -eq 0) {
              $code = if ($proc.HasExited) { $proc.ExitCode } else { "unknown" }
              throw "MR_Thermometry.exe is not running (startup exit code $code)."
            }
          } while ((Get-Date) -lt $deadline)
          $alive | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package as zip
        run: |
          Compress-Archive -Path dist/MR_Thermometry.exe -DestinationPath MR_Thermometry-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MR_Thermometry-windows
          path: MR_Thermometry-windows.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MR_Thermometry-windows

      - name: Refuse a non-semver tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing tag '${GITHUB_REF_NAME}'. Only vMAJOR.MINOR.PATCH publishes a release."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          files: MR_Thermometry-windows.zip
          generate_release_notes: true
          body: |
            ## 重要说明

            - ⚠️ **本版本没有监管认证，不能当成治疗终点。**
            - 构建产物未签名。首次运行 `MR_Thermometry.exe` 时，Windows SmartScreen 可能提示“Windows 已保护你的电脑”。这是未签名下载文件的系统行为，不是安装失败。

            ## 安装与使用

            1. 下载 `MR_Thermometry-windows.zip`
            2. 解压后运行 `MR_Thermometry.exe`
            3. 使用 "Batch Load DICOM Files" 加载 DICOM 数据开始分析

            下面是本标签相对上一标签的自动变更记录。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
