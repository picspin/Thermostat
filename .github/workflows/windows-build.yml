name: windows-build

on:
  push:
    branches: [main]
    # Full-string glob. `+` is "one or more", so vtest / v-next / v1 do not run.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install pinned Windows build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MR_Thermometry --add-data "icon.png;." run.py

      - name: Smoke-test that the exe stays running
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist\MR_Thermometry.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          $limit = 30
          $exited = $false
          for ($i = 0; $i -lt $limit; $i++) {
            if ($proc.HasExited) { $exited = $true; break }
            Start-Sleep -Seconds 1
          }
          if ($exited) {
            throw "MR_Thermometry.exe exited early with code $($proc.ExitCode). This only checks that the frozen process stays up; it is not a manual GUI acceptance test and not a clinical-data check."
          }
          Stop-Process -Id $proc.Id -Force
          $proc.WaitForExit()
          Write-Host "Smoke test passed: process was still alive after $limit seconds and was then stopped. Not a clinical GUI acceptance test."

      - name: Package as zip
        shell: pwsh
        run: |
          if (Get-Process -Name MR_Thermometry -ErrorAction SilentlyContinue) {
            Stop-Process -Name MR_Thermometry -Force
          }
          Compress-Archive -Path dist/MR_Thermometry.exe -DestinationPath MR_Thermometry-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MR_Thermometry-windows
          path: MR_Thermometry-windows.zip
          retention-days: 30

  release:
    needs: build
    # Tag filter above is the real gate. This repeats it so a branch push cannot publish.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Refuse a non-semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os, re, sys; tag = os.environ["TAG"]; sys.exit(0 if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) else 1)'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MR_Thermometry-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: MR_Thermometry-windows.zip
          generate_release_notes: true
          body: |
            本版本没有监管认证，不能当成治疗终点。

            `${{ github.ref_name }}` 的 Windows 包是 GitHub Actions 在 `windows-latest` 上用 PyInstaller 打的 `MR_Thermometry-windows.zip`。解压后运行 `MR_Thermometry.exe`。这个 exe 没有代码签名，Windows SmartScreen 可能在第一次运行时拦截。

            工作流里的启动检查只确认进程没有马上退出，不是在 Windows 上用临床数据做的手工界面验收。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
