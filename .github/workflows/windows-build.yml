name: windows-build

on:
  push:
    branches: [main]
    # Tag filters are globs, not regular expressions. "+" is a literal
    # character here, so v[0-9]+.[0-9]+.[0-9]+ would not match v1.2.3.
    # This glob requires a v<digits>.<digits>.<digits> shape. The release
    # job then refuses anything that is not exactly vMAJOR.MINOR.PATCH.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name MR_Thermometry --add-data "icon.png;." run.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist/MR_Thermometry.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          # The onefile bundle is about 170 MB, so extraction can take a
          # while. Fail only if the process dies before 90 seconds.
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 3
            $alive = @(Get-Process -Name MR_Thermometry -ErrorAction SilentlyContinue)
            if ($alive.Count -eq 0) {
              $code = if ($proc.HasExited) { $proc.ExitCode } else { "unknown" }
              throw "MR_Thermometry.exe is not running (startup exit code $code)."
            }
          } while ((Get-Date) -lt $deadline)
          $alive | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package as zip
        run: |
          Compress-Archive -Path dist/MR_Thermometry.exe -DestinationPath MR_Thermometry-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MR_Thermometry-windows
          path: MR_Thermometry-windows.zip
          retention-days: 30

  # Same workflow as the Windows job so a tag push cannot start two
  # releases. Pull requests only upload artifacts; the release job below
  # is tag-only. macos-latest is Apple Silicon: this package is arm64,
  # not a universal binary. Intel is out of scope. No Apple certificate,
  # codesign identity, or notarytool.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-macos-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-macos-build.txt

      - name: Require an arm64 runner and interpreter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Expected Apple Silicon macos-latest (arm64), got $(uname -m)."
            exit 1
          fi
          python - <<'PY'
          import platform
          import sys
          machine = platform.machine()
          print(f"python {sys.version} machine={machine}")
          if machine != "arm64":
              sys.exit(
                  f"Python is {machine}, not arm64. "
                  "Refusing to build an Intel or universal package."
              )
          PY

      - name: Build the arm64 .app with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          # Colon, not the Windows semicolon. --target-arch arm64 refuses a
          # universal2 bundle. Do not pass a codesign identity.
          # --onefile matches the Windows packager. An onedir .app splits
          # cv2 between Frameworks and Resources, and that loader then
          # recurses on import. --windowed still emits MR_Thermometry.app.
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name MR_Thermometry \
            --target-arch arm64 \
            --osx-bundle-identifier com.picspin.mrthermometry \
            --add-data "icon.png:." \
            run.py
          test -d dist/MR_Thermometry.app

      - name: Smoke-test the bundled executable
        shell: bash
        run: |
          set -euo pipefail
          app="dist/MR_Thermometry.app"
          bin="$app/Contents/MacOS/MR_Thermometry"
          if [[ ! -d "$app" ]]; then
            echo "Build did not produce $app"
            exit 1
          fi
          if [[ ! -x "$bin" ]]; then
            echo "Bundle executable is missing or not executable: $bin"
            exit 1
          fi
          archs="$(lipo -archs "$bin")"
          echo "lipo -archs: ${archs}"
          if [[ "$archs" != "arm64" ]]; then
            echo "Expected a single arm64 slice, got: ${archs}"
            exit 1
          fi
          log="${RUNNER_TEMP:-/tmp}/mr-thermometry-smoke.log"
          # Nobody is on the runner to click the window. The onefile bundle
          # extracts before the window exists; fail only if that process
          # dies before 90 seconds, same as the Windows exe.
          "$bin" >"$log" 2>&1 &
          pid=$!
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
            sleep 3
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "MR_Thermometry exited before the 90 second smoke window."
              wait "$pid" || true
              echo "--- stdout/stderr ---"
              cat "$log" || true
              exit 1
            fi
          done
          kill "$pid" 2>/dev/null || true
          sleep 1
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
          fi
          wait "$pid" 2>/dev/null || true

      - name: Package the .app as an arm64 DMG
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          ditto "dist/MR_Thermometry.app" "$staging/MR_Thermometry.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "MR Thermometry" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "MR_Thermometry-macos-arm64.dmg"
          mount="$(mktemp -d)"
          hdiutil attach "MR_Thermometry-macos-arm64.dmg" -nobrowse -readonly -mountpoint "$mount"
          packed="$mount/MR_Thermometry.app/Contents/MacOS/MR_Thermometry"
          test -d "$mount/MR_Thermometry.app"
          test -x "$packed"
          packed_archs="$(lipo -archs "$packed")"
          echo "dmg lipo -archs: ${packed_archs}"
          hdiutil detach "$mount" || hdiutil detach "$mount" -force
          if [[ "$packed_archs" != "arm64" ]]; then
            echo "DMG executable is not arm64-only: ${packed_archs}"
            exit 1
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MR_Thermometry-macos-arm64
          path: MR_Thermometry-macos-arm64.dmg
          retention-days: 30

  release:
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MR_Thermometry-windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MR_Thermometry-macos-arm64

      - name: Refuse a non-semver tag or a one-sided package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing tag '${GITHUB_REF_NAME}'. Only vMAJOR.MINOR.PATCH publishes a release."
            exit 1
          fi
          test -f MR_Thermometry-windows.zip
          test -f MR_Thermometry-macos-arm64.dmg
          echo "Publishing Windows zip and arm64 DMG together for ${GITHUB_REF_NAME}."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            MR_Thermometry-windows.zip
            MR_Thermometry-macos-arm64.dmg
          generate_release_notes: true
          body: |
            ## 重要说明

            - ⚠️ **本版本没有监管认证，不能当成治疗终点。**
            - 这一版包含已合并的腹部、头部、关节运动校正预设，以及主界面上的序列加载。
            - Windows 构建产物未签名。首次运行 `MR_Thermometry.exe` 时，Windows SmartScreen 可能提示“Windows 已保护你的电脑”。这是未签名下载文件的系统行为，不是安装失败。
            - macOS DMG（`MR_Thermometry-macos-arm64.dmg`）未签名，也没有公证。第一次打开会被 Gatekeeper 拦住。这不是安装失败。该包只含 Apple Silicon arm64，不是通用二进制，不能在 Intel Mac 上运行。

            ## 安装与使用

            ### Windows

            1. 下载 `MR_Thermometry-windows.zip`
            2. 解压后运行 `MR_Thermometry.exe`

            ### macOS（Apple Silicon / arm64）

            1. 下载 `MR_Thermometry-macos-arm64.dmg`
            2. 打开 DMG，将 `MR_Thermometry.app` 拷出来再打开

            ### 加载数据

            主窗口没有 “Batch Load DICOM Files”。

            - 两帧温度：在 **Two-frame temperature** 里用 **Load 1st Real DICOM**、**Load 1st Imaginary DICOM**、**Load 2nd Real DICOM**、**Load 2nd Imaginary DICOM**。需要 B0 时再点 **Load B0 Map DICOM**，然后点 **Calculate Temperature Change**。
            - 序列：在 **Sequence** 里点 **Load DICOM Sequence**（**File → Load → Load DICOM Sequence** 和 **Batch → Load Folders** 是同一个入口）。在 “Select DICOM Folders” 窗口里点 **Add Folder**。运动校正部位用 **Body part:**，选项是 Abdomen、Head、Joint。

            下面是本标签相对上一标签的自动变更记录。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
